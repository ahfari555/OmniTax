<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniTax - US Federal Income Tax & Refund Estimator</title>
  <meta name="description" content="100% free US federal income tax calculators. Estimate your IRS tax bracket, tax liability, and tax refund instantly.">
  <meta name="google-site-verification" content="google45274bc7d9133ca5" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2805918301542012" crossorigin="anonymous"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
  
  <header class="bg-white border-b border-slate-200 px-6 py-4">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <span class="text-xl font-extrabold tracking-tight text-blue-600">OmniTax</span>
      <span class="text-xs font-bold bg-blue-50 text-blue-600 px-3 py-1 rounded-full">US IRS Tax Tools</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-12 flex-1 w-full space-y-8">
    <div class="text-center space-y-3">
      <h1 class="text-3xl md:text-4xl font-black">US Federal Income Tax & Refund Estimator</h1>
      <p class="text-slate-500 text-sm max-w-xl mx-auto">Calculate your estimated federal income tax bracket, liability, and year-end tax refunds instantly.</p>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6 max-w-2xl mx-auto">
      <div>
        <label class="text-xs font-bold text-slate-600 block mb-1">Annual Gross Income ($):</label>
        <input type="number" id="salary" value="85000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <button onclick="calcTax()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md">
        Calculate Federal Tax 📊
      </button>

      <div id="result" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center space-y-2">
        <div class="text-xs uppercase font-bold text-slate-400">Estimated Tax Liability:</div>
        <div id="taxOwed" class="text-3xl font-black text-blue-600">$0</div>
      </div>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    © 2026 OmniTax. Independent US Tax Estimators.
  </footer>

  <script>
    function calcTax() {
      const salary = parseFloat(document.getElementById('salary').value) || 0;
      const tax = salary * 0.18; // Simplified estimate
      document.getElementById('taxOwed').innerText = '$' + Math.round(tax).toLocaleString();
      document.getElementById('result').classList.remove('hidden');
    }
  </script>
</body>
</html>
